<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="glow" cx="50%" cy="47%" r="50%">
      <stop offset="0%" stop-color="#8fecff" stop-opacity="0.55"/>
      <stop offset="46%" stop-color="#39b8ff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0a2a5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx="41%" cy="37%" r="64%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="16%" stop-color="#c9f3ff"/>
      <stop offset="40%" stop-color="#4fd6ff"/>
      <stop offset="72%" stop-color="#1f7fe0"/>
      <stop offset="100%" stop-color="#0a2c6e"/>
    </radialGradient>
    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset="68%" stop-color="#4fe3ff" stop-opacity="0"/>
      <stop offset="91%" stop-color="#a6f2ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#4fe3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spec" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- outer atmospheric glow -->
  <circle cx="512" cy="502" r="446" fill="url(#glow)"/>

  <!-- tilted orbit ring, behind the sphere for depth -->
  <g transform="rotate(-24 512 502)">
    <ellipse cx="512" cy="502" rx="372" ry="150" fill="none" stroke="#63dcff" stroke-width="7" stroke-opacity="0.55"/>
    <ellipse cx="512" cy="502" rx="312" ry="118" fill="none" stroke="#8fe8ff" stroke-width="3" stroke-opacity="0.35"/>
  </g>

  <!-- glass sphere -->
  <circle cx="512" cy="502" r="300" fill="url(#ball)"/>
  <!-- fresnel rim -->
  <circle cx="512" cy="502" r="300" fill="url(#rim)"/>
  <circle cx="512" cy="502" r="300" fill="none" stroke="#c9f7ff" stroke-width="4" stroke-opacity="0.7"/>
  <!-- specular highlight -->
  <ellipse cx="428" cy="408" rx="98" ry="72" fill="url(#spec)" transform="rotate(-28 428 408)"/>
</svg>
